[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eais-scheduling-agent"
version = "0.1.0"
description = "Multi-sector appointment booking orchestrator with approval gates and audit trails"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Ahmed", email = "ahmed.omer778@gmail.com"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
eais-book = "eais_scheduling_agent.cli:main"

[tool.setuptools]
packages = ["eais_scheduling_agent", "eais_scheduling_agent.core", "eais_scheduling_agent.manifests", "eais_scheduling_agent.skillpacks", "eais_scheduling_agent.skillpacks.clinic", "eais_scheduling_agent.skillpacks.restaurant", "eais_scheduling_agent.intake"]

[tool.setuptools.package-data]
eais_scheduling_agent = ["manifests/**/*.yaml", "manifests/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v"
